# Runs every check on each push and pull request: format, types, lint, the lint
# self-test, the scenarios and the break test. `pnpm check` is the same command a
# person runs locally. The runner's preinstalled Rust toolchain builds the core.

name: check

on:
  push:
  pull_request:
    # `edited` reruns the title check below when only the title changes.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Keeps Cargo's registry and target folder between runs. SQLite compiles from source on a cold cache.
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # A squash merge makes the PR title the commit on main, so it follows the commit rules.
      # The title goes through an environment variable, never straight into the script.
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node lint/commit-title.ts --title "$TITLE"

      - run: pnpm check

      # One transcript per scenario run. Uploaded on failure too, when it matters most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts
          path: artifacts
          if-no-files-found: warn

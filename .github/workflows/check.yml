# Runs every check on each pull request and on main: format, types, lint, the lint
# self-test, the scenarios (each run twice, to catch a transcript that changes from run to
# run), the break test, the UI check and the Electron check. It is
# `pnpm check`, the same command a person runs locally, split into parallel jobs: the
# `checks` job runs everything but the break test, and the `breaks` jobs share out the break
# test, which alone takes most of the time. The `check` job passes only when they all pass.
# The runner's preinstalled Rust toolchain builds the core.

name: check

# Pull requests, plus main after each merge. Not every branch push: a push run reports a
# `check` on the same commit as the PR run, and could stand in for a failing one.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` reruns the title check below when only the title changes.
    types: [opened, edited, synchronize, reopened]

# A new run for a pull request stops the one before it, which checks a commit or title that
# is gone. Runs on main all finish, so each merge gets its own result.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Keeps Cargo's registry and target folder between runs. SQLite compiles from source on a cold cache.
      # The `breaks` jobs start from the same cache, and only this job saves it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core

      - run: pnpm install --frozen-lockfile

      # The UI check (`pnpm check:ui`) drives Playwright's headless Chromium. The Playwright
      # version, and so the browser's, comes from packages/dev-host/package.json.
      - run: pnpm --filter @letterbox/dev-host exec playwright install --with-deps --only-shell chromium

      # A squash merge makes the PR title the commit on main, so it follows the commit rules.
      # The title goes through an environment variable, never straight into the script.
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node lint/commit-title.ts --title "$TITLE"

      # On a pull request, the file-size check compares the baseline with the base commit's,
      # and the scenarios compare packages/harness/drift-allowed.txt with it, so both can only
      # shrink. A shallow checkout lacks that commit, so fetch it.
      - if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      # The Electron check (`pnpm check:electron`) opens real windows, sandboxed. Ubuntu 24.04
      # stops unprivileged user namespaces through AppArmor, and Chromium's sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # xvfb-run gives the Electron check a display. Without one it fails and says so.
      - run: xvfb-run -a pnpm check:without-breaks
        env:
          FILE_SIZE_BASE: ${{ github.event.pull_request.base.sha }}
          DRIFT_BASE: ${{ github.event.pull_request.base.sha }}

      # One transcript per scenario run, and the UI and Electron checks' screenshots, trace and logs.
      # Uploaded on failure too, when it matters most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts
          path: artifacts
          if-no-files-found: warn

  # The break test (`pnpm scenarios:selftest`), one shard per job. Each break rebuilds the core
  # and runs scenarios, one at a time, so more jobs is the only way to run them side by side.
  breaks:
    runs-on: ubuntu-latest
    strategy:
      # Every shard finishes, so one run lists every missed break.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          save-if: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm scenarios:selftest --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The status the main branch's ruleset requires. It passes only when every job above passed.
  check:
    needs: [checks, breaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          BREAKS: ${{ needs.breaks.result }}
        run: |
          echo "checks: $CHECKS, breaks: $BREAKS"
          test "$CHECKS" = success && test "$BREAKS" = success

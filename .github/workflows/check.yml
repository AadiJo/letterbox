# Runs every check on each push and pull request: format, types, lint, the lint
# self-test and the scenarios. `pnpm check` is the same command a person runs locally.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # One transcript per scenario run. Uploaded on failure too, when it matters most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts
          path: artifacts
          if-no-files-found: warn

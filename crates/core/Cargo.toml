[package]
name = "letterbox-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
letterbox-protocol.workspace = true
base64 = "0.22"
chrono.workspace = true
chrono-tz.workspace = true
foldhash.workspace = true
indexmap.workspace = true
# The body pipeline's HTML parser and rewriter (see src/body/mod.rs for why this one).
lol_html = "3.0.3"
# The HTML standard's full table of character references, to read attribute values as a browser does.
html-escape = "0.3.1"
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util.workspace = true
# Checks the DKIM signature RFC 8058 asks for before a one-click unsubscribe (src/unsubscribe/dkim.rs).
# Stalwart's, kept up with its mail server. Its DNS goes through the host, so its own resolver gets no servers.
mail-auth = { version = "0.16.0", default-features = false, features = ["dns-hickory", "rust-crypto"] }
# Decodes the subject and body a mailto unsubscribe names (RFC 6068), where + is not a space.
percent-encoding = "2.3"
# WHATWG URL parsing, as browsers do it, for the hosts of remote images and unsubscribe targets.
url = "2.5.8"

[lints]
workspace = true

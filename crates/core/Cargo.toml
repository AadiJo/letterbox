[package]
name = "letterbox-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
letterbox-protocol.workspace = true
base64 = "0.22"
chrono.workspace = true
chrono-tz.workspace = true
foldhash.workspace = true
indexmap.workspace = true
# The body pipeline's HTML parser and rewriter (see src/body/mod.rs for why this one).
lol_html = "3.0.3"
# The HTML standard's full table of character references, to read attribute values as a browser does.
html-escape = "0.3.1"
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util.workspace = true
# The operating system's cryptographic random source, for the body pipeline's CSS prefix (clock.rs).
getrandom = "0.4"
# WHATWG URL parsing, as browsers do it, for the hosts of remote images and unsubscribe targets.
url = "2.5.8"

[lints]
workspace = true
